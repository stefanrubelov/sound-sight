[project]
name = "soundsight-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "greenlet>=3.0",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "python-multipart>=0.0.12",
  "websockets>=13",
  "langchain>=0.3",
  "langchain-ollama>=0.2",
  "langchain-chroma>=0.1",
  "langchain-mcp-adapters>=0.1",
  "sentence-transformers>=3.2",
  "chromadb>=0.5",
  "librosa>=0.10",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "black>=24.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"  # ruff doesn't support py314 yet; py313 is the closest

[tool.black]
line-length = 100
target-version = ["py313"]  # black doesn't support py314 yet

[tool.pytest.ini_options]
asyncio_mode = "auto"
