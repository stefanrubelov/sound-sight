name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-python:
    name: Lint Python (black + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run black + ruff
        run: pre-commit run black ruff --all-files

  lint-frontend:
    name: Lint Frontend (prettier + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Prettier check
        working-directory: frontend
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: ESLint
        working-directory: frontend
        run: npm run lint

  test-backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # closest available; 3.14 not yet on GH Actions runners

      - name: Install dependencies
        working-directory: backend
        run: pip install --ignore-requires-python -e ".[dev]"

      - name: Run pytest
        working-directory: backend
        run: pytest --tb=short -q

  test-firmware:
    name: Firmware native tests (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run native tests
        working-directory: firmware
        run: pio test -e native
